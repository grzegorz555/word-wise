<header class="flex items-center justify-between gap-4">
  <h1 class="text-lg font-semibold">{{ 'app.title' | transloco }}</h1>
  <nav [attr.aria-label]="'app.uiLanguage' | transloco">
    <!--
      Figma "WordWise — mobile proposal", node 7:26: separate buttons with a gap, border, white
      background; the active one is primary with white text.
      variant="outline" gives every item a border; spacing="2" (8 px) separates the items and turns
      off the "joined" rounded corners (helm only joins them when spacing is 0).
    -->
    <hlm-toggle-group
      type="single"
      variant="outline"
      spacing="2"
      [nullable]="false"
      [value]="activeLang()"
      (valueChange)="setLanguage($event)"
    >
      @for (lang of languages; track lang) {
        <!--
          TODO(human) [learn]: style the active item as in Figma.
          1. White background for every item: a token from styles/tokens.css (which one is white?).
          2. Active item: background primary, text primary-foreground. brain sets data-state="on"
             on it, so use Tailwind's data attribute variant: data-[state=on]:…
             https://tailwindcss.com/docs/hover-focus-and-other-states#data-attributes
          3. helm adds hover:bg-muted, so the active item turns grey on hover. Add a hover class
             that only applies while it is on (variants stack left to right).
          Check: the active item against the page background needs >= 3:1 (SC 1.4.11), and the
          focus ring must still be visible (Tab).
        -->
        <button
          class="h-11 min-w-11"
          hlmToggleGroupItem
          [hlmTooltip]="endonyms[lang]"
          [value]="lang"
          [aria-label]="endonyms[lang]"
          [attr.lang]="lang"
        >
          {{ lang.toUpperCase() }}
        </button>
      }
    </hlm-toggle-group>
  </nav>
</header>

<main>
  <p>{{ 'app.tagline' | transloco }}</p>
  <router-outlet />
</main>
