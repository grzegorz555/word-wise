<header class="flex items-center justify-between gap-4">
  <h1 class="text-lg font-semibold">{{ 'app.title' | transloco }}</h1>
  <nav [attr.aria-label]="'app.uiLanguage' | transloco">
    <hlm-toggle-group
      type="single"
      [nullable]="false"
      [value]="activeLang()"
      (valueChange)="setLanguage($event)"
    >
      @for (lang of languages; track lang) {
        <button
          class="h-11 min-w-11"
          hlmToggleGroupItem
          [hlmTooltip]="endonyms[lang]"
          [value]="lang"
          [aria-label]="endonyms[lang]"
          [attr.lang]="lang"
        >
          {{ lang.toUpperCase() }}
        </button>
      }
    </hlm-toggle-group>
  </nav>
</header>

<main>
  <p>{{ 'app.tagline' | transloco }}</p>
  <router-outlet />
</main>
