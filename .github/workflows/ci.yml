name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    # Postgres 18 for the integration tests (ADR-0013). The test fixture creates its own database
    # wordwise_test_<id> on this server and drops it at the end.
    # User, password and database are throwaway values for this ephemeral CI container (it lives only
    # as long as the job and is reachable only from the runner), not secrets.
    # Docs: https://docs.github.com/en/actions/using-containerized-services/creating-postgresql-service-containers
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wordwise
          POSTGRES_PASSWORD: wordwise_ci
          POSTGRES_DB: wordwise
        ports:
          - 5432:5432
        # The job waits until the container is healthy before the first step runs.
        options: >-
          --health-cmd "pg_isready -U wordwise -d wordwise"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # Overrides appsettings.Development.json ("__" stands for ":" in configuration keys); same values as above.
    env:
      ConnectionStrings__WordWise: Host=localhost;Port=5432;Database=wordwise;Username=wordwise;Password=wordwise_ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet restore WordWise.slnx
      - run: dotnet format WordWise.slnx --verify-no-changes --no-restore
      - run: dotnet build WordWise.slnx --no-restore -c Release
      # The build writes src/web/openapi/WordWise.Api.json (ADR-0012): it must match the committed file.
      - name: OpenAPI document is up to date
        run: |
          git diff --exit-code -- src/web/openapi
          test -z "$(git status --porcelain -- src/web/openapi)"
      - run: dotnet tool restore
      # Fails (exit 1) when the EF Core model changed but no migration was added.
      # No database is needed: it compares the model with the snapshot in Migrations/.
      # Design-time tools default to the Development environment, so the host reads the
      # local, non-secret connection string from appsettings.Development.json.
      # Docs: https://learn.microsoft.com/ef/core/managing-schemas/migrations/managing#checking-for-pending-model-changes
      - name: EF Core model has a migration
        run: dotnet ef migrations has-pending-model-changes --project src/api/WordWise.Api --no-build --configuration Release
      - run: dotnet test --solution WordWise.slnx --no-build -c Release

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      # The client in src/app/core/api is generated from the committed OpenAPI document (ADR-0012).
      - name: API client is up to date
        run: |
          npm run api:gen
          git diff --exit-code -- src/app/core/api
          test -z "$(git status --porcelain -- src/app/core/api)"
      - run: npx prettier --check "src/**/*.{ts,html,scss,css}"
      - run: npx ng build
      - run: npx ng test --watch=false
